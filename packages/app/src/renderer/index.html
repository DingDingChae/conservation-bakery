<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Conservation Bakery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    No remote assets, no CDN, no network of any kind — every stylesheet and script
    below resolves to a local file, and this policy makes that a build failure rather
    than a promise: `connect-src 'none'` means even a bug that tried to fetch would be
    blocked by the platform itself, not just by convention.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none';"
  />

  <!-- Design tokens (packages/design) — see that package's README: read only by
       custom-property name, never copied or forked, so a token change there is a
       token change everywhere in this window with no rebuild step of its own. -->
  <link rel="stylesheet" href="../../../design/tokens/index.css" />
  <link rel="stylesheet" href="../../../design/tokens/kid.css" />

  <!-- Design components — the worked HTML+CSS every panel below is built from. -->
  <link rel="stylesheet" href="../../../design/components/panel-frame.css" />
  <link rel="stylesheet" href="../../../design/components/label-strip.css" />
  <link rel="stylesheet" href="../../../design/components/annunciator-tile.css" />
  <link rel="stylesheet" href="../../../design/components/mode-selector.css" />
  <link rel="stylesheet" href="../../../design/components/numeric-entry.css" />
  <link rel="stylesheet" href="../../../design/components/setpoint-readout.css" />
  <link rel="stylesheet" href="../../../design/components/trend-recorder.css" />
  <link rel="stylesheet" href="../../../design/components/faceplate.css" />
  <link rel="stylesheet" href="../../../design/components/toast.css" />
  <link rel="stylesheet" href="../../../design/components/command-palette.css" />

  <!-- This package's own panels, each shipping the component-specific rules its own
       design preview does not cover (see each file's own header comment). Copied
       into dist/renderer alongside this document by scripts/copy-renderer-assets.mjs
       — tsc only emits the *.ts it compiles, never a *.css or *.html file. -->
  <link rel="stylesheet" href="./palette/palette.css" />
  <link rel="stylesheet" href="./provenance/balance.css" />
  <link rel="stylesheet" href="./provenance/tree.css" />

  <!-- The control room shell itself: header, nav rail, main area, settings, fault. -->
  <link rel="stylesheet" href="./styles/shell.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
